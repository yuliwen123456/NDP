general:
  mode: train
  seed: 2025
  ckpt_path: null
  project_name: mask4former3d
  workspace: null
  instance_population: 20
  dbscan_eps: null
  experiment_name: ${now:%Y-%m-%d_%H%M%S}
  save_dir: /root/autodl-tmp/NDP/outputs/compare-physical-b2-20260913-095207-ed17a261/training
  gpus: 1
data:
  train_mode: train
  validation_mode: valid
  test_mode: test
  ignore_label: 255
  add_distance: true
  in_channels: 2
  num_labels: 19
  instance_population: ${general.instance_population}
  sweep: 1
  min_stuff_cls_id: 9
  min_points: 50
  class_names:
  - car
  - bicycle
  - motorcycle
  - truck
  - other-vehicle
  - person
  - bicyclist
  - motorcyclist
  - road
  - parking
  - sidewalk
  - other-ground
  - building
  - fence
  - vegetation
  - trunk
  - terrain
  - pole
  - traffic-sign
  pin_memory: true
  num_workers: 4
  batch_size: 2
  test_batch_size: 1
  voxel_size: 0.05
  base_path: /root/autodl-tmp/NDP/data
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    shuffle: true
    pin_memory: ${data.pin_memory}
    num_workers: ${data.num_workers}
    batch_size: ${data.batch_size}
  validation_dataloader:
    _target_: torch.utils.data.DataLoader
    shuffle: false
    pin_memory: ${data.pin_memory}
    num_workers: ${data.num_workers}
    batch_size: ${data.test_batch_size}
  test_dataloader:
    _target_: torch.utils.data.DataLoader
    shuffle: false
    pin_memory: ${data.pin_memory}
    num_workers: ${data.num_workers}
    batch_size: ${data.test_batch_size}
  train_dataset:
    _target_: datasets.lidar.LidarDataset
    data_dir: ${data.base_path}
    config_path: conf/mask4former3d.yaml
    mode: ${data.train_mode}
    add_distance: ${data.add_distance}
    sweep: ${data.sweep}
    instance_population: ${data.instance_population}
    ignore_label: ${data.ignore_label}
    volume_augmentations_path: conf/augmentation/volumentations_aug.yaml
  validation_dataset:
    _target_: datasets.lidar_no_preprocessing.LidarDataset
    data_dir: ${data.base_path}/validation
    config_path: conf/mask4former3d.yaml
    mode: ${data.validation_mode}
    add_distance: ${data.add_distance}
    sweep: ${data.sweep}
    instance_population: 0
    ignore_label: ${data.ignore_label}
    volume_augmentations_path: null
  test_dataset:
    _target_: datasets.lidar_no_preprocessing.LidarDataset
    data_dir: ${data.base_path}/test
    config_path: conf/mask4former3d.yaml
    mode: ${data.test_mode}
    add_distance: ${data.add_distance}
    sweep: ${data.sweep}
    instance_population: 0
    ignore_label: ${data.ignore_label}
    volume_augmentations_path: null
  train_collation:
    _target_: datasets.utils.VoxelizeCollate
    ignore_label: ${data.ignore_label}
    voxel_size: ${data.voxel_size}
  validation_collation:
    _target_: datasets.utils.VoxelizeCollate
    ignore_label: ${data.ignore_label}
    voxel_size: ${data.voxel_size}
  test_collation:
    _target_: datasets.utils.VoxelizeCollate
    ignore_label: ${data.ignore_label}
    voxel_size: ${data.voxel_size}
logging:
- _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
  name: ${general.experiment_name}
  save_dir: ${general.save_dir}
model:
  _target_: models.Mask4Former3D
  backbone:
    _target_: models.Res16UNet34C
    config:
      dialations:
      - 1
      - 1
      - 1
      - 1
      conv1_kernel_size: 5
      bn_momentum: 0.02
    in_channels: ${data.in_channels}
    out_channels: ${data.num_labels}
  num_queries: 100
  num_heads: 8
  num_decoders: 3
  num_levels: 4
  sample_sizes:
  - 4000
  - 8000
  - 16000
  - 32000
  mask_dim: 128
  dim_feedforward: 1024
  num_labels: ${data.num_labels}
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0002
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    max_lr: ${optimizer.lr}
    epochs: ${trainer.max_epochs}
    steps_per_epoch: -1
    total_steps: 1130
  pytorch_lightning_params:
    interval: step
trainer:
  max_epochs: 10
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  limit_val_batches: 0
  enable_progress_bar: false
  log_every_n_steps: 10
  accumulate_grad_batches: 4
callbacks:
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  save_last: true
  save_top_k: -1
  mode: max
  dirpath: ${general.save_dir}
  filename: '{epoch}'
  every_n_epochs: 1
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
matcher:
  _target_: models.matcher.HungarianMatcher
  cost_class: 2.0
  cost_mask: 5.0
  cost_dice: 2.0
  cost_box: 5.0
loss:
  _target_: models.criterion.SetCriterion
  num_classes: ${data.num_labels}
  eos_coef: 0.1
  losses:
  - labels
  - masks
  - bboxs
metric:
  _target_: models.metrics.PanopticEval
  n_classes: ${data.num_labels}
  ignore_label: ${data.ignore_label}
  min_points: ${data.min_points}
